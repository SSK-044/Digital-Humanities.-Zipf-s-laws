<!DOCTYPE html>

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { background-color: #faf8f2; font-family: 'Arsenal', sans-serif; }
    .hero { background: linear-gradient(135deg, #4a4f30 0%, #767d4c 100%); color: white; padding: 40px 20px; text-align: center; border-radius: 0; }
    
    .card { 
        background-color: transparent; /* Робить фон блоку таким самим, як у сторінки */
        border: 2px solid #4a4f30; /* Ваше зелене обведення */
        border-radius: 4px; /* Легке заокруглення кутів */
        transition: transform 0.2s; 
        margin-top: 50px; /* Опускає білі блоки нижче від зеленої шапки */
    }
    .card:hover { transform: translateY(-5px); }
    
    /* Робимо текст всередині блоків примусово чорним */
    .card h3, .card p { color: #000000 !important; }
    
    .btn-custom { 
        background-color: #4a4f30; /* Зелений колір кнопки */
        color: #ffffff !important; /* Білий текст */
        border: none;
        padding: 10px 25px; 
        font-weight: bold; 
        font-family: 'Arsenal', sans-serif; 
        border-radius: 3px; 
        transition: 0.2s;
    }
    .btn-custom:hover { 
        background-color: #767d4c; /* Кнопка трохи світлішає при наведенні мишки */
    }
</style>
</head>
